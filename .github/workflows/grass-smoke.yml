name: Wild Meadow grass smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/threejs-controller-toon-rendering]

permissions:
  contents: write

jobs:
  grass-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline game JavaScript syntax
        run: node tests/check-inline-script-syntax.cjs
      - name: Test grass module construction and shader injection
        run: node tests/grass-system-smoke.cjs
      - name: Test existing controller and rendering integration
        run: node tests/threejs-adaptation-smoke.cjs
      - name: Test asset loading and attribution
        run: node tests/asset-integration-smoke.cjs

  browser-preview:
    if: github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'visual evidence:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render desktop and mobile screenshots
        run: node tests/capture-grass-preview.cjs
      - name: Commit genuine screenshots to the feature branch
        if: success() && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'visual evidence:')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/*.png screenshots/browser-report.json
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged; no evidence commit needed."
          else
            git commit -m "visual evidence: capture cinematic and mobile views"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Publish genuine browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wild-meadow-grass-browser-captures
          path: |
            screenshots/*.png
            screenshots/browser-report.json
          if-no-files-found: warn
          retention-days: 14
