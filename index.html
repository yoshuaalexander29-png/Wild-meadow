const scene=new THREE.Scene();scene.background=new THREE.Color('#c8ddd5');scene.fog=new THREE.Fog('#c8ddd5',22,72);

for(let i=0;i<34;i++){let z=-5-rnd()*26,x=(rnd()-.5)*29;if(Math.abs(x)<3.4&&z>-9)continue;tree(x,z,.65+rnd()*.8)}

const grassGeo=new THREE.ConeGeometry(.055,.42,3);grassGeo.translate(0,.21,0);const grassPalette=['#4f7842','#6d9149','#8ca955','#3d7144','#a5b765'];
for(let group=0;group<grassPalette.length;group++){const count=group===0?1700:700,mesh=new THREE.InstancedMesh(grassGeo,mat(grassPalette[group]),count);const dummy=new THREE.Object3D();for(let i=0;i<count;i++){let x=(rnd()-.5)*35,z=5-rnd()*33;if(Math.abs(x)<3.0&&z>-7&&z<1){x+=x<0?-2.6:2.6}dummy.position.set(x,-.02,z);dummy.rotation.set(0,rnd()*Math.PI,((rnd()-.5)*.18));let s=.55+rnd()*1.1;dummy.scale.set(s,s*(.65+rnd()*.8),s);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix)}scene.add(mesh)}
// Flower patches create colour groupings rather than uniform noise.
const flowerColors=['#e6c77a','#dca29b','#f4edcf','#b9c4df','#e9b95d'];for(let patch=0;patch<22;patch++){let cx=(rnd()-.5)*26,cz=1-rnd()*25;if(Math.abs(cx)<3.2&&cz>-6)continue;for(let i=0;i<9;i++){let x=cx+(rnd()-.5)*1.7,z=cz+(rnd()-.5)*1.7;const stem=new THREE.Mesh(new THREE.CylinderGeometry(.012,.018,.24,4),mat('#4f7a42'));stem.position.set(x,.12,z);scene.add(stem);const flower=new THREE.Mesh(new THREE.IcosahedronGeometry(.075,1),mat(flowerColors[patch%flowerColors.length]));flower.scale.set(1,.55,1);flower.position.set(x,.27,z);scene.add(flower)}}
// Contact shadows are soft translucent discs, kept separate from model meshes.
function shadow(x,z,sx,sz){const m=new THREE.Mesh(new THREE.CircleGeometry(1,24),new THREE.MeshBasicMaterial({color:'#26372a',transparent:true,opacity:.22,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set(x,.008,z);m.scale.set(sx,sz,1);scene.add(m);return m}shadow(-1.65,-1.3,.8,.45);shadow(1.6,-1.4,.65,.4);
const loader=new GLTFLoader();const loaded=[];let loadCount=0;function showError(label,e){errorBox.style.display='block';errorBox.textContent=`Asset load failed: ${label}\n${e?.message||e||'Unknown error'}\nCheck network access to cdn.cinevva.com and reload.`;status.textContent='A required character asset did not load.'}
function fitModel(root,targetHeight){const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());if(!Number.isFinite(size.y)||size.y<.01)throw new Error('Model has no measurable geometry');root.position.x-=center.x;root.position.z-=center.z;root.position.y-=box.min.y;root.scale.multiplyScalar(targetHeight/size.y);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.roughness=Math.max(.52,o.material.roughness??.8);o.material.flatShading=true;o.material.needsUpdate=true}}});}
function loadCharacter(url,label,x,z,targetHeight,rotation=0){return new Promise((resolve,reject)=>loader.load(url,gltf=>{const root=gltf.scene;try{fitModel(root,targetHeight);root.position.x+=x;root.position.z+=z;root.rotation.y=rotation;scene.add(root);let mixer=null;if(gltf.animations?.length){mixer=new THREE.AnimationMixer(root);const clip=gltf.animations.find(c=>/idle|stand/i.test(c.name))||gltf.animations[0];mixer.clipAction(clip).play()}loaded.push({root,mixer,clips:gltf.animations||[],label});loadCount++;status.textContent=`Character assets loaded: ${loadCount}/2 · ${loaded.map(c=>c.label).join(' + ')}`;if(loadCount===2){status.textContent='Both external CC0 GLB characters loaded';status.classList.add('ready')};resolve(root)}catch(e){reject(e)}},undefined,reject))}
const ASSETS={forest:'https://cdn.cinevva.com/assets/packs/quaternius/zombie-apocalypse-kit/Characters_Lis.glb?download=1',warrior:'https://cdn.cinevva.com/assets/packs/quaternius/ultimate-animated-characters/Knight_Male.glb?download=1',sword:'https://cdn.cinevva.com/assets/packs/quaternius/cube-world/Sword_Gold.glb?download=1'};
const promiseForest=loadCharacter(ASSETS.forest,'Forest wanderer',-1.7,-1.3,2.05,0.12).catch(e=>showError('Forest wanderer (Quaternius Characters_Lis.glb)',e));
const promiseWarrior=loadCharacter(ASSETS.warrior,'Silverland knight',1.55,-1.5,2.12,-.12).catch(e=>showError('Warrior (Quaternius Knight_Male.glb)',e));
// The sword is a real CC0 asset; place it near the warrior as a readable prop while model-specific hand attachment is verified.
loader.load(ASSETS.sword,gltf=>{const weapon=gltf.scene;const box=new THREE.Box3().setFromObject(weapon),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());weapon.position.set(2.35,.08,-1.1);weapon.scale.setScalar(0.68/Math.max(size.y,.01));weapon.rotation.set(0,0,-.3);weapon.traverse(o=>{if(o.isMesh)o.castShadow=false});scene.add(weapon)},undefined,e=>{status.textContent='Characters loading; sword asset unavailable (characters remain usable).'});
const shots=[{t:0,p:[0,5.8,17],look:[0,1.2,-6],f:47},{t:4,p:[-5.1,3.1,6.4],look:[-1.7,1.15,-1.5],f:36},{t:8,p:[4.9,2.8,5.9],look:[1.55,1.05,-1.4],f:34},{t:13,p:[0,2.35,5.4],look:[0,1.15,-1.5],f:32},{t:20,p:[0.2,4.1,9.6],look:[0,1.35,-1.7],f:40}];let start=performance.now(),paused=false,pauseAt=0,manual=false,shot=0,yaw=0,pitch=0,drag=false,lastX=0,lastY=0;const clock=new THREE.Clock();function ease(v){return v*v*(3-2*v)}function cameraAt(t){if(manual)return shots[Math.min(shot,shots.length-1)];let i=0;while(i<shots.length-2&&t>shots[i+1].t)i++;const a=shots[i],b=shots[i+1],u=ease(THREE.MathUtils.clamp((t-a.t)/(b.t-a.t),0,1));return {p:a.p.map((v,j)=>THREE.MathUtils.lerp(v,b.p[j],u)),look:a.look.map((v,j)=>THREE.MathUtils.lerp(v,b.look[j],u)),f:THREE.MathUtils.lerp(a.f,b.f,u)}}
